<!-- Alert Notification Message Box Fragment -->
<div th:fragment="messagebox"
     th:if="${session.message}"
     th:object="${session.message}"
     th:classappend="*{type == 'green' or type == 'success' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-800 dark:text-emerald-300' : (type == 'red' or type == 'danger' or type == 'error' ? 'border-rose-500/30 bg-rose-500/10 text-rose-800 dark:text-rose-300' : (type == 'yellow' or type == 'warning' ? 'border-amber-500/30 bg-amber-500/10 text-amber-800 dark:text-amber-300' : 'border-blue-500/30 bg-blue-500/10 text-blue-800 dark:text-blue-300'))}"
     class="flex items-center p-3.5 mb-4 text-xs font-semibold rounded-xl border backdrop-blur-sm shadow-xs transition-all animate-fadeIn"
     role="alert">

    <!-- Success Icon -->
    <svg th:if="*{type == 'green' or type == 'success'}" class="w-4 h-4 me-2.5 shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>

    <!-- Error Icon -->
    <svg th:if="*{type == 'red' or type == 'danger' or type == 'error'}" class="w-4 h-4 me-2.5 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>

    <!-- Warning / Info Icon -->
    <svg th:unless="*{type == 'green' or type == 'success' or type == 'red' or type == 'danger' or type == 'error'}" class="w-4 h-4 me-2.5 shrink-0 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>

    <div class="flex-1">
        <span th:text="*{content}">Notification message</span>
    </div>

    <th:block th:text="${@sessionHelper.removeMessage()}"></th:block>
</div>
