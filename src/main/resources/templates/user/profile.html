<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Base::parent(~{::#content},~{::title})}">
<head>
    <title th:text="${LoggedInUser != null ? LoggedInUser.name + ' | Profile' : 'Profile'}">Profile</title>
</head>
<body>
<div id="content">
    <!-- Sidebar Fragment -->
    <div th:if="${LoggedInUser != null}">
        <div th:replace="~{user/SideBar::sidebar}"></div>
    </div>

    <!-- Main Content Area with Clean 96px Clearance -->
    <div class="md:ml-64 min-h-screen px-4 sm:px-8 pb-12 pt-24">
        <div class="max-w-4xl mx-auto w-full space-y-6">

            <!-- Breadcrumb & Header -->
            <div class="pb-4 border-b border-slate-200 dark:border-slate-800">
                <nav class="flex text-xs text-slate-400 mb-1.5" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-2">
                        <li><a th:href="@{/SMC/user/dashboard}" class="hover:text-blue-600 dark:hover:text-blue-400">Dashboard</a></li>
                        <li><span>/</span></li>
                        <li class="text-slate-700 dark:text-slate-200 font-semibold">Profile</li>
                    </ol>
                </nav>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Account Profile</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Your registered user details and authentication credentials.</p>
            </div>

            <!-- Profile Card -->
            <div class="glass-panel rounded-2xl overflow-hidden shadow-sm w-full">
                <!-- Cover Banner -->
                <div class="h-28 bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-700 relative"></div>

                <div class="px-6 pb-6 pt-0 -mt-12">
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                        <div class="flex items-end gap-4">
                            <div class="relative">
                                <img class="w-24 h-24 rounded-full object-cover border-4 border-white dark:border-[#0b0f19] avatar-halo bg-slate-200 shadow-lg"
                                     th:src="@{/SMC/user/profile-pic}"
                                     onerror="this.onerror=null;this.src='/Images/profile-svgrepo-com.svg';"
                                     alt="Profile Avatar">
                                <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-white dark:border-[#0b0f19] rounded-full"></span>
                            </div>
                            <div class="mb-1">
                                <h2 class="text-xl font-bold text-slate-900 dark:text-white" th:text="${LoggedInUser?.name}">User Name</h2>
                                <p class="text-xs text-slate-500 dark:text-slate-400" th:text="${LoggedInUser?.email}">user@example.com</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <span class="px-3.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20"
                                  th:text="'Auth: ' + ${LoggedInUser?.provider}">
                                Provider: SELF
                            </span>
                        </div>
                    </div>

                    <!-- Details Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 w-full">
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">User ID</p>
                            <p class="text-xs font-mono font-medium text-slate-800 dark:text-slate-200 mt-1 truncate" th:text="${LoggedInUser?.id}">id-12345</p>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Phone Number</p>
                            <p class="text-xs font-medium text-slate-800 dark:text-slate-200 mt-1"
                               th:text="${LoggedInUser?.phoneNumber != null and !LoggedInUser.phoneNumber.isEmpty() ? LoggedInUser.phoneNumber : 'Not linked'}">
                                Not linked
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Email Status</p>
                            <p class="text-xs font-semibold mt-1 inline-flex items-center gap-1.5"
                               th:classappend="${LoggedInUser?.emailVerified} ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'">
                                <span class="w-2 h-2 rounded-full" th:classappend="${LoggedInUser?.emailVerified} ? 'bg-emerald-500' : 'bg-amber-500'"></span>
                                <span th:text="${LoggedInUser?.emailVerified ? 'Verified' : 'Pending Verification'}">Status</span>
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800">
                            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Stored Contacts</p>
                            <p class="text-xs font-semibold text-blue-600 dark:text-blue-400 mt-1"
                               th:text="${LoggedInUser?.contacts != null ? LoggedInUser.contacts.size() : 0} + ' saved'">
                                0 saved
                            </p>
                        </div>
                    </div>

                    <!-- About / Bio -->
                    <div class="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 w-full">
                        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">About</p>
                        <p class="text-xs text-slate-700 dark:text-slate-300 mt-1 leading-relaxed"
                           th:text="${LoggedInUser?.about != null and !LoggedInUser.about.isEmpty() ? LoggedInUser.about : 'No biography added yet.'}">
                            No biography added yet.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
