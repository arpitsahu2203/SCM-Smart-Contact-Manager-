<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Base::parent(~{::#content},~{::title})}">
<head>
    <title th:text="${LoggedInUser != null ? LoggedInUser.name + ' | Add Contact' : 'Add Contact'}">Add Contact</title>
</head>
<body>
<div id="content">
    <!-- Sidebar Fragment -->
    <div th:if="${LoggedInUser != null}">
        <div th:replace="~{user/SideBar::sidebar}"></div>
    </div>

    <!-- Main Content Area with Clean 96px Clearance -->
    <div class="md:ml-64 min-h-screen px-4 sm:px-8 pb-12 pt-24">
        <div class="max-w-4xl mx-auto w-full space-y-6">

            <!-- Breadcrumb & Header -->
            <div class="pb-4 border-b border-slate-200 dark:border-slate-800">
                <nav class="flex text-xs text-slate-400 mb-1.5" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-2">
                        <li><a th:href="@{/SMC/user/dashboard}" class="hover:text-blue-600 dark:hover:text-blue-400">Dashboard</a></li>
                        <li><span>/</span></li>
                        <li><a th:href="@{/SMC/user/Contact/view}" class="hover:text-blue-600 dark:hover:text-blue-400">Contacts</a></li>
                        <li><span>/</span></li>
                        <li class="text-slate-700 dark:text-slate-200 font-semibold">New Contact</li>
                    </ol>
                </nav>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Add New Contact</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Store personal details, social accounts, and upload a Cloudinary avatar.</p>
            </div>

            <!-- Global Alert Messages -->
            <div th:replace="~{messages::messagebox}"></div>

            <!-- Form Card with Robust Flex Architecture -->
            <div class="glass-panel rounded-2xl p-6 sm:p-8 shadow-sm w-full">
                <form th:action="@{/SMC/user/Contact/add}"
                      method="post"
                      th:object="${contactForm}"
                      enctype="multipart/form-data"
                      class="space-y-6 w-full">

                    <div class="flex flex-col lg:flex-row gap-8 w-full">

                        <!-- Left Column: Avatar Dropzone & Favorite (Fixed Width) -->
                        <div class="w-full lg:w-72 shrink-0 space-y-5">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-2">
                                    Contact Photo
                                </label>
                                <!-- Cloudinary Cyan Dropzone -->
                                <div class="dropzone-cyan rounded-2xl p-6 text-center cursor-pointer relative group flex flex-col items-center justify-center min-h-[220px]"
                                     onclick="document.getElementById('imageFileInput').click()">
                                    <input th:field="*{contactImage}"
                                           id="imageFileInput"
                                           type="file"
                                           accept="image/*"
                                           class="hidden">

                                    <!-- Upload Icon / Initial State -->
                                    <div id="dropzone-empty-prompt" class="space-y-2 flex flex-col items-center">
                                        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 text-cyan-500 dark:text-cyan-400 flex items-center justify-center border border-cyan-500/20 group-hover:scale-110 transition-transform">
                                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                            </svg>
                                        </div>
                                        <p class="text-xs font-semibold text-slate-800 dark:text-slate-200">Drag & drop or <span class="text-cyan-600 dark:text-cyan-400 underline">browse</span></p>
                                        <p class="text-[10px] text-slate-400">PNG, JPG, WebP up to 5MB</p>
                                    </div>

                                    <!-- Preview Image -->
                                    <div id="preview-wrapper" class="hidden flex flex-col items-center gap-2">
                                        <img id="uplaod_image_preview"
                                             src=""
                                             alt="Avatar Preview"
                                             class="w-24 h-24 rounded-full object-cover border-2 border-cyan-400 avatar-halo shadow-md">
                                        <button type="button" id="remove-preview-btn"
                                                class="px-2.5 py-1 text-[10px] font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-colors">
                                            Remove image
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Favorite Toggle Card -->
                            <div class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/60 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="text-amber-500 text-sm">★</span>
                                    <label for="favourite" class="text-xs font-semibold text-slate-800 dark:text-slate-200 cursor-pointer">
                                        Mark as Favorite
                                    </label>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input th:field="*{favourite}" id="favourite" type="checkbox" class="sr-only peer">
                                    <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-blue-600"></div>
                                </label>
                            </div>
                        </div>

                        <!-- Right Column: Form Inputs (Expands to 100%) -->
                        <div class="flex-1 w-full space-y-4">
                            <!-- Contact Name -->
                            <div class="w-full">
                                <label for="name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                                    Full Name <span class="text-rose-500">*</span>
                                </label>
                                <div class="relative w-full">
                                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                        </svg>
                                    </div>
                                    <input th:field="*{name}" type="text" id="name" required
                                           class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                           placeholder="e.g. Sarah Jenkins">
                                </div>
                                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-[11px] text-rose-500"></p>
                            </div>

                            <!-- Email & Phone -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                                <div class="w-full">
                                    <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                                        Email Address <span class="text-rose-500">*</span>
                                    </label>
                                    <div class="relative w-full">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                            </svg>
                                        </div>
                                        <input th:field="*{email}" type="email" id="email" required
                                               class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                               placeholder="sarah@example.com">
                                    </div>
                                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-[11px] text-rose-500"></p>
                                </div>

                                <div class="w-full">
                                    <label for="phoneNumber" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                                        Phone Number <span class="text-rose-500">*</span>
                                    </label>
                                    <div class="relative w-full">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                            </svg>
                                        </div>
                                        <input th:field="*{phoneNumber}" type="tel" id="phoneNumber" required
                                               class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                               placeholder="+1 234 567 8900">
                                    </div>
                                    <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-1 text-[11px] text-rose-500"></p>
                                </div>
                            </div>

                            <!-- Social Links -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                                <div class="w-full">
                                    <label for="linkedinLink" class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">LinkedIn Profile</label>
                                    <div class="relative w-full">
                                        <span class="absolute inset-y-0 start-0 flex items-center ps-2.5 pointer-events-none text-blue-600 font-bold text-xs">in</span>
                                        <input th:field="*{linkedinLink}" type="url" id="linkedinLink"
                                               class="w-full py-1.5 ps-7 pe-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                               placeholder="linkedin.com/in/...">
                                    </div>
                                </div>

                                <div class="w-full">
                                    <label for="websiteLink" class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Website URL</label>
                                    <div class="relative w-full">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-2.5 pointer-events-none text-slate-400">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                                            </svg>
                                        </div>
                                        <input th:field="*{websiteLink}" type="url" id="websiteLink"
                                               class="w-full py-1.5 ps-7 pe-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                               placeholder="https://example.com">
                                    </div>
                                </div>

                                <div class="w-full">
                                    <label for="twitterLink" class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">X (Twitter)</label>
                                    <div class="relative w-full">
                                        <span class="absolute inset-y-0 start-0 flex items-center ps-2.5 pointer-events-none text-slate-700 dark:text-slate-300 font-black text-xs">𝕏</span>
                                        <input th:field="*{twitterLink}" type="url" id="twitterLink"
                                               class="w-full py-1.5 ps-7 pe-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                               placeholder="x.com/...">
                                    </div>
                                </div>
                            </div>

                            <!-- Address -->
                            <div class="w-full">
                                <label for="address" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Address</label>
                                <textarea th:field="*{address}" id="address" rows="2"
                                          class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                          placeholder="Street, City, Postal Code..."></textarea>
                                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-[11px] text-rose-500"></p>
                            </div>

                            <!-- Notes & Bio with Live Character Counter -->
                            <div class="w-full">
                                <div class="flex items-center justify-between mb-1.5">
                                    <label for="description" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                                        Notes & Bio
                                    </label>
                                    <span id="contact-bio-count" class="text-[10px] text-slate-400 font-mono">0 / 500</span>
                                </div>
                                <textarea th:field="*{description}" id="description" rows="3" maxlength="500"
                                          class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                          placeholder="Add context, role, or relationship details..."></textarea>
                            </div>
                        </div>

                    </div>

                    <!-- Bottom Action Buttons -->
                    <div class="pt-5 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-3 w-full">
                        <a th:href="@{/SMC/user/Contact/view}"
                           class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-700 dark:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition-colors">
                            Cancel
                        </a>
                        <button type="submit"
                                class="btn-primary-gradient px-5 py-2 text-xs font-semibold rounded-xl bg-blue-600 text-white inline-flex items-center gap-2 shadow-md shadow-blue-500/30 hover:bg-blue-700 active:scale-[0.98] transition-all">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span class="text-white font-semibold">Save Contact</span>
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <!-- Client-side Image Preview & Admin Script -->
    <script th:src="@{/JS/Admin.js}"></script>
</div>
</body>
</html>
