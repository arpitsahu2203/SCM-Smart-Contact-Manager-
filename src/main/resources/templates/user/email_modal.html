<div th:fragment="emailModal" id="email-modal"
  class="fixed inset-0 z-[60] hidden overflow-y-auto bg-slate-950/65 p-4 backdrop-blur-sm">
  <div class="mx-auto flex min-h-full max-w-4xl items-center justify-center py-6">
    <form method="post" enctype="multipart/form-data" action="/SMC/user/email/send"
      class="w-full overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900">
      <div
        class="flex items-start justify-between bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 px-6 py-5 text-white">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[.18em] text-white/75">Gmail composer</p>
          <h2 class="mt-1 text-xl font-bold">Email <span id="email-contact-name"></span></h2>
          <p id="email-recipient-label" class="mt-1 text-sm text-white/80"></p>
        </div><button type="button" data-email-close
          class="rounded-xl bg-white/15 px-3 py-1 text-xl hover:bg-white/25">×</button>
      </div>
      <div class="grid gap-0 lg:grid-cols-[1fr_250px]">
        <div class="space-y-4 p-6">
          <div id="google-connect"
            class="hidden rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900"><b>Google
              connection required.</b> <a href="/oauth2/authorization/google" class="font-bold underline">Sign in with
              Google →</a></div>
          <div id="google-status" class="text-xs font-medium text-slate-500">Checking Google connection…</div>
          <input type="hidden" name="contactId" id="email-contact-id"><input type="hidden" name="recipientEmail"
            id="email-recipient">
          <div class="flex flex-wrap gap-2"><button type="button" id="ai-write"
              class="rounded-xl bg-violet-100 px-3 py-2 text-xs font-bold text-violet-700">✨ Write with
              AI</button><button type="button" id="ai-polish"
              class="rounded-xl bg-slate-100 px-3 py-2 text-xs font-bold text-slate-700">🪄 Polish draft</button><button
              type="button" id="email-history"
              class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-bold text-slate-600">📜 Sent
              history</button></div>
          <p id="email-action-message" class="hidden rounded-xl px-3 py-2 text-xs font-medium" role="status"
            aria-live="polite"></p>
          <section id="ai-drawer" class="hidden rounded-2xl border border-violet-100 bg-violet-50 p-4">
            <div class="mb-3 flex justify-between"><b class="text-sm text-violet-950">Guided AI draft</b><span
                class="text-xs text-violet-600">Google Gemini</span></div>
            <div class="grid gap-2 sm:grid-cols-2"><input id="ai-purpose" placeholder="Purpose"
                class="rounded-xl border border-violet-200 bg-white p-2 text-sm"><select id="ai-tone"
                class="rounded-xl border border-violet-200 bg-white p-2 text-sm">
                <option>Professional</option>
                <option>Friendly</option>
                <option>Concise</option>
                <option>Persuasive</option>
              </select></div><textarea id="ai-points" placeholder="Key talking points"
              class="mt-2 h-20 w-full rounded-xl border border-violet-200 bg-white p-2 text-sm"></textarea><input
              id="ai-cta" placeholder="e.g., Schedule a 15-minute call this week"
              class="mt-2 w-full rounded-xl border border-violet-200 bg-white p-2 text-sm"><button type="button"
              id="ai-generate" class="mt-3 rounded-xl bg-violet-600 px-4 py-2 text-xs font-bold text-white">Generate
              draft</button>
          </section>
          <label class="block text-xs font-bold text-slate-600">SUBJECT<input required name="subject" id="email-subject"
              placeholder="A clear, helpful subject"
              class="mt-1 w-full rounded-xl border border-slate-200 p-3 text-sm"></label><label
            class="block text-xs font-bold text-slate-600">MESSAGE<textarea required name="body" id="email-body"
              placeholder="Write your message…"
              class="mt-1 h-48 w-full rounded-xl border border-slate-200 p-3 text-sm"></textarea></label>
          <label
            class="block cursor-pointer rounded-2xl border-2 border-dashed border-slate-200 p-4 text-center text-sm text-slate-500"><input
              name="attachments" id="email-attachments" type="file" multiple class="hidden"><span
              class="font-semibold text-violet-600">Add attachments</span><br><span id="attachment-summary"
              class="text-xs">Up to 25 MB total</span></label>
          <div id="history-list" class="hidden max-h-48 overflow-auto rounded-xl border border-slate-100 p-3 text-xs">
          </div>
        </div>
        <aside class="border-t border-slate-100 bg-slate-50 p-6 dark:bg-slate-950 lg:border-l lg:border-t-0">
          <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Delivery</p>
          <p class="mt-3 text-sm font-semibold text-slate-800 dark:text-white">Sent directly from your Gmail</p>
          <p class="mt-2 text-xs leading-relaxed text-slate-500">Your message and attachments are saved in this
            contact’s history. No SMTP password is needed.</p>
          <div class="mt-6 border-t border-slate-200 pt-4"><button type="button" data-email-close
              class="w-full rounded-xl px-3 py-2 text-sm font-semibold text-slate-600">Cancel</button><button
              id="email-send" class="mt-2 w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white">Send
              via Gmail 🚀</button></div>
        </aside>
      </div>
    </form>
  </div>
</div>
