<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{Base::parent(~{::#content},~{::title})}">
<head>
    <title>Create Account | Smart Contact Manager</title>
</head>
<body>
<div th:fragment="content" id="content" class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 sm:p-6 pt-24 pb-12">
    <div class="w-full max-w-lg space-y-6">

        <!-- Registration Card -->
        <div class="glass-panel rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-800">
            <!-- Clean Modern Brand Header -->
            <div class="flex flex-col items-center text-center mb-6">
                <a th:href="@{/SMC/home}" class="mb-3 group">
                    <div class="flex items-center gap-2.5">
                        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-md shadow-blue-500/25 shrink-0 group-hover:scale-105 transition-transform">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                            Smart<span class="text-blue-600 dark:text-blue-400">Contact</span>
                        </span>
                    </div>
                </a>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white mt-1">Create your account</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Get started with Smart Contact Manager in seconds.</p>
            </div>

            <!-- Global Message / Feedback -->
            <div th:replace="~{messages::messagebox}"></div>

            <!-- OAuth Fast Sign Up Buttons (High Contrast) -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <a th:href="@{/oauth2/authorization/google}"
                   class="flex items-center justify-center gap-2 px-3 py-2.5 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 bg-white hover:bg-slate-50 dark:bg-slate-800/90 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-xs transition-all hover:scale-[1.02] active:scale-[0.98]">
                    <img src="https://www.vectorlogo.zone/logos/google/google-icon.svg" alt="Google" class="w-4 h-4"/>
                    <span>Sign up with Google</span>
                </a>

                <a th:href="@{/oauth2/authorization/github}"
                   class="flex items-center justify-center gap-2 px-3 py-2.5 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 bg-white hover:bg-slate-50 dark:bg-slate-800/90 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-100 shadow-xs transition-all hover:scale-[1.02] active:scale-[0.98]">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.28-.01-1.03-.02-2.03-3.2.69-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.71.08-.69.08-.69 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.27-5.24-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.17a10.9 10.9 0 0 1 5.74 0c2.19-1.48 3.15-1.17 3.15-1.17.62 1.59.23 2.76.11 3.05.73.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.65.41.35.78 1.05.78 2.12 0 1.53-.01 2.77-.01 3.15 0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                    </svg>
                    <span>Sign up with GitHub</span>
                </a>
            </div>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white dark:bg-[#111827] px-3 text-[11px] font-semibold text-slate-400">Or register with email</span>
                </div>
            </div>

            <!-- Registration Form -->
            <form th:action="@{/SMC/do-register}"
                  method="post"
                  th:object="${userform}"
                  class="space-y-4"
                  novalidate>

                <!-- Full Name -->
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Full Name <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <input type="text" id="name" th:field="*{name}" required
                               class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                               placeholder="e.g. Alex Morgan">
                    </div>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-[11px] text-rose-500"></p>
                </div>

                <!-- Email & Phone in 2 cols -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                            Email Address <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <input type="email" id="email" th:field="*{email}" required
                                   class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                   placeholder="alex@domain.com">
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-[11px] text-rose-500"></p>
                    </div>

                    <div>
                        <label for="phoneNumber" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                            Phone Number <span class="text-rose-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                            </div>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" required
                                   class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                                   placeholder="9876543210">
                        </div>
                        <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="mt-1 text-[11px] text-rose-500"></p>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        Password <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input type="password" id="password" th:field="*{password}" required
                               class="w-full py-2 ps-9 pe-3 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                               placeholder="Choose a strong password">
                    </div>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-[11px] text-rose-500"></p>
                </div>

                <!-- About / Bio with Live Character Counter -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="about" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
                            About Yourself <span class="text-rose-500">*</span>
                        </label>
                        <span id="bio-char-count" class="text-[10px] text-slate-400 font-mono">0 / 500</span>
                    </div>
                    <textarea id="about" th:field="*{about}" rows="3" required maxlength="500"
                              class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-white dark:bg-slate-900 dark:border-slate-800 text-slate-900 dark:text-white modern-input placeholder:text-slate-400"
                              placeholder="A short introduction about who you are..."></textarea>
                    <p th:if="${#fields.hasErrors('about')}" th:errors="*{about}" class="mt-1 text-[11px] text-rose-500"></p>
                </div>

                <!-- Submit Button: Highly Visible in Both Light & Dark Mode -->
                <div class="pt-2">
                    <button type="submit"
                            class="btn-primary-gradient w-full py-2.5 px-4 text-xs font-semibold rounded-xl bg-blue-600 text-white inline-flex items-center justify-center gap-2 shadow-md shadow-blue-500/30 hover:bg-blue-700 active:scale-[0.99] transition-all">
                        <span class="text-white font-semibold">Create Account</span>
                        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Footer Sign In Link -->
            <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
                Already registered?
                <a th:href="@{/login}" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">
                    Sign in here
                </a>
            </p>
        </div>

    </div>
</div>
</body>
</html>
