spring.application.name=SMC

# Import .env file if present in the project root
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scm2}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# Google OAuth2 Configuration
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===================================================================
# GitHub OAuth2 Configuration
# ===================================================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=user:email

# ===================================================================
# Cloudinary Configuration
# ===================================================================
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.cloud.api.key=${CLOUDINARY_API_KEY:}
cloudinary.cloud.api.secret=${CLOUDINARY_API_SECRET:}
